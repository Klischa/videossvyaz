import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Чтение параметров подписи release-сборки из keystore.properties (gitignored).
// Если файла нет — release собирается без подписи (app-release-unsigned.apk).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.p2pcall'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.p2pcall"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "2.2"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Debug всегда подписан стандартным debug-ключом AGP.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Раздельные APK по архитектурам: arm64-v8a ~12 МБ вместо универсальных ~48 МБ.
    // universalApk true — дополнительно собирает универсальный APK (для sideload).
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Явно регистрируем каталог с Kotlin-исходниками (наряду со стандартным src/main/java).
    sourceSets {
        getByName("main") {
            java.srcDirs("src/main/kotlin")
        }
    }

    // lint не должен блокировать выпуск APK в CI (мы не выкладываемся в Play Store).
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // WebRTC.
    // Оригинальный org.webrtc:google-webrtc более недоступен в публичных репозиториях
    // (jcenter выключен). Используем поддерживаемый форк io.getstream:stream-webrtc-android —
    // он публикует те же классы в пакете org.webrtc.*, поэтому код менять не нужно.
    implementation 'io.getstream:stream-webrtc-android:1.3.10'

    // QR-коды: генерация (BarcodeEncoder) и сканирование (IntentIntegrator).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
