name: Build APK

# Запускается:
#   • при пуше в main,
#   • при создании тега v* (→ дополнительно публикуется GitHub Release с APK),
#   • в PR и вручную (workflow_dispatch).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания GitHub Release при теге

jobs:
  build:
    runs-on: ubuntu-latest

    # Секреты на уровне джобы: в шаговых if нельзя ссылаться на `secrets`,
    # но можно проверять `env.*`, который заполняется из секретов.
    env:
      KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Подпись release — только если заданы секреты; иначе release собирается
      # без подписи (app-*-unsigned.apk), debug — всегда.
      - name: Decode signing keystore
        if: ${{ env.KS_B64 != '' }}
        run: echo "$KS_B64" | base64 -d > "$HOME/release.jks"

      - name: Write keystore.properties
        if: ${{ env.KS_B64 != '' }}
        run: |
          echo "storeFile=$HOME/release.jks" > keystore.properties
          echo "storePassword=$STORE_PASS" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASS" >> keystore.properties

      - name: Build debug & release APKs (ABI splits)
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # При пуше тега v* — создаём GitHub Release и прикрепляем все APK.
      # Если секреты подписи заданы, в релиз попадают подписанные release-APK.
      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" --title "$TAG" --generate-notes \
            $(find app/build/outputs/apk -name '*.apk')
